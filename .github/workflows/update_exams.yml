name: Exam Auto Update

on:
  schedule:
    # 每月 1 日 UTC 13:00（台北時間 21:00）執行
    - cron: '0 13 1 * *'
  workflow_dispatch: # 允許手動觸發

permissions:
  contents: write
  actions: write  # 有新考題時觸發 update_articles.yml 重建網站

concurrency:
  group: land-exam-update
  cancel-in-progress: false

jobs:
  update-exams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.10'

    - name: Download new land exams
      working-directory: landnotev3
      env:
        PYTHONIOENCODING: utf-8
      run: uv run python -m landnote.main exams --type land --update

    - name: Re-merge PDFs for updated subjects
      working-directory: landnotev3/地政考古題
      env:
        PYTHONIOENCODING: utf-8
      run: uv run --with PyPDF2 --with pymupdf python pdf_merger.py --changed

    - name: Download new law exams
      working-directory: landnotev3
      env:
        PYTHONIOENCODING: utf-8
      run: uv run python -m landnote.main exams --type law --update

    - name: Re-merge law PDFs for updated subjects
      working-directory: landnotev3/高點法律考古題
      env:
        PYTHONIOENCODING: utf-8
      run: uv run --with PyPDF2 --with pymupdf python pdf_merger.py --changed

    - name: Rebuild appraiser exam question bank
      working-directory: landnotev3
      env:
        PYTHONIOENCODING: utf-8
      run: uv run --with pymupdf python -m landnote.main exambank

    - name: Check scanned PDFs pending OCR
      # 只提醒（warning 註記＋執行摘要），不讓流程失敗；OCR 需在本機跑 scripts/ocr_scanned.py
      continue-on-error: true
      working-directory: landnotev3
      env:
        PYTHONIOENCODING: utf-8
      run: uv run --with pymupdf python scripts/ocr_scanned.py --check

    - name: Update README stats
      run: uv run --no-project python landnotev3/scripts/update_readme_stats.py

    - name: Commit and push new exams
      id: commit
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md landnotev3/地政考古題 landnotev3/高點法律考古題 landnotev3/data/exam_bank
        # 只有 README 時間戳 / log 變動、沒有新 PDF 時不 commit
        if [ -z "$(git diff --staged --name-only -- '*.pdf')" ]; then
          echo "No new exams"
        else
          ADDED=$(git -c core.quotepath=off diff --staged --name-only --diff-filter=A -- '*.pdf' | grep -v '合併後PDF檔案' || true)
          LAND=$(printf '%s\n' "$ADDED" | grep -c '^landnotev3/地政考古題/' || true)
          LAW=$(printf '%s\n' "$ADDED" | grep -c '^landnotev3/高點法律考古題/' || true)
          git commit -m "docs: auto-update exams (land +${LAND}, law +${LAW}) [skip ci]"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Trigger site rebuild
      # 新考題要進逐題讀、題庫、近期修法考點，不等下次週二/四排程；
      # GITHUB_TOKEN 觸發的 workflow_dispatch 是官方允許的例外，會真的啟動另一個 workflow
      if: steps.commit.outputs.pushed == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run update_articles.yml --ref main
