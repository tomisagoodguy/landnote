site_name: Landnote 數位圖書館
site_url: https://tomisagoodguy.github.io/landnote/
site_author: Landnote AI
repo_url: https://github.com/tomisagoodguy/landnote
theme:
  name: material
  language: zh-TW
  font: false
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.expand
  - navigation.tracking
  - navigation.indexes
  - navigation.top
  - navigation.instant
  - search.suggest
  - search.highlight
  - search.share
  - content.code.copy
  - header.autohide
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: 切換至夜晚模式
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: 切換至日間模式
extra_css:
- stylesheets/extra.css
extra_javascript:
- javascripts/extra.js
plugins:
- search
- blog:
    post_dir: blog/posts
    blog_toc: true
    post_url_format: '{date}/{slug}'
    archive: true
    categories: true
    tags: true
    recent_posts: 5
    pagination_per_page: 10
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.highlight
- pymdownx.tabbed
- pymdownx.emoji
- attr_list
- md_in_html
- toc:
    permalink: true
    toc_depth: 3
nav:
- 最新文章: blog/
- 主題探索與講義下載: tags.md
- 考古題下載: exams.md
